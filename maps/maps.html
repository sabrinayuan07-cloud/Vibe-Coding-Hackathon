<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps - UBC Study Spot Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f0ff 0%, #e8dcff 100%);
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background: white;
            box-shadow: 0 2px 10px rgba(155, 125, 212, 0.1);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
        }

        .nav-container button {
            padding: 12px 30px;
            border: none;
            background: transparent;
            color: #6b5b7d;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-container button:hover {
            background: #f5f0ff;
            color: #9b7dd4;
        }

        .nav-container button.active {
            background: linear-gradient(135deg, #9b7dd4 0%, #7c5fc2 100%);
            color: white;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(155, 125, 212, 0.3);
        }

        .nav-container a {
            text-decoration: none;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 20px;
            height: calc(100vh - 120px);
        }

        /* Map Section */
        .map-container {
            flex: 2;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(155, 125, 212, 0.1);
        }

        .map-container h2 {
            font-size: 24px;
            color: #2d1b4e;
            margin-bottom: 15px;
        }

        #map {
            width: 100%;
            height: calc(100% - 50px);
            border-radius: 12px;
            background: #e8f5e9;
        }

        /* Details Section */
        .details-container {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(155, 125, 212, 0.1);
            overflow-y: auto;
            max-height: calc(100vh - 140px);
        }

        #placeholder {
            text-align: center;
            padding: 40px 20px;
            color: #6b5b7d;
        }

        #placeholder p {
            font-size: 16px;
            margin-top: 20px;
        }

        #details {
            display: none;
        }

        #spot-name {
            font-size: 26px;
            color: #2d1b4e;
            margin-bottom: 15px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            background: #f5f0ff;
            padding: 15px;
            border-radius: 10px;
        }

        .info-label {
            display: block;
            font-size: 14px;
            color: #6b5b7d;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            color: #2d1b4e;
            font-weight: 600;
        }

        .info-section {
            margin-bottom: 20px;
        }

        .info-section .info-item {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Reviews */
        .reviews {
            margin-top: 25px;
        }

        .reviews h3 {
            font-size: 20px;
            color: #2d1b4e;
            margin-bottom: 15px;
        }

        #reviews-list {
            margin-bottom: 20px;
        }

        .review {
            background: #f5f0ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .review-user {
            font-weight: 600;
            color: #2d1b4e;
        }

        .review-rating {
            color: #ffd700;
        }

        .review-comment {
            color: #6b5b7d;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Buttons */
        #add-review-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #9b7dd4 0%, #7c5fc2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }

        #add-review-btn:hover {
            transform: translateY(-2px);
        }

        /* Review Form */
        #review-form {
            display: none;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2d1b4e;
            margin-bottom: 8px;
        }

        #review-comment {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8dcff;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        #review-comment:focus {
            outline: none;
            border-color: #9b7dd4;
        }

        .star-rating {
            display: flex;
            gap: 10px;
            font-size: 32px;
            cursor: pointer;
        }

        .star {
            color: #e8dcff;
            transition: color 0.2s;
        }

        .star:hover,
        .star.active {
            color: #ffd700;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
        }

        .form-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #cancel-review {
            background: #f5f0ff;
            color: #9b7dd4;
        }

        #cancel-review:hover {
            background: #e8dcff;
        }

        #submit-review {
            background: linear-gradient(135deg, #9b7dd4 0%, #7c5fc2 100%);
            color: white;
        }

        #submit-review:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="../home/Home.html"><button>Home</button></a>
            <a href="../maps/Maps.html"><button class="active">Maps</button></a>
            <a href="../profile/profile.html"><button>Profile</button></a>

    <!-- Main Container -->

        <div class="map-container">
            <h2>🗺️ Campus Map</h2>
            <div id="map"></div>
        </div>

        <!-- Details Section -->
        <div class="details-container">
            <!-- Placeholder -->
            <div id="placeholder">
                <div style="font-size: 48px;">📍</div>
                <p>Click on a marker to view study spot details</p>
            </div>

            <!-- Details Content -->
            <div id="details">
                <h2 id="spot-name"></h2>

                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">⭐ Rating</span>
                        <span class="info-value" id="spot-rating"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">💺 Seats</span>
                        <span class="info-value" id="spot-seats"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">🔊 Noise Level</span>
                        <span class="info-value" id="spot-noise"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label"><span id="spot-outlet-icon"></span> Outlets</span>
                        <span class="info-value" id="spot-outlets"></span>
                    </div>
                </div>

                <div class="info-section">
                    <div class="info-item">
                        <span class="info-label">📍 Location:</span>
                        <span id="spot-location"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">🕒 Hours:</span>
                        <span id="spot-hours"></span>
                    </div>
                </div>

                <!-- Reviews -->
                <div class="reviews">
                    <h3>Reviews (<span id="review-count">0</span>)</h3>
                    <div id="reviews-list"></div>
                    <button id="add-review-btn">Write a Review</button>
                </div>

                <!-- Review Form -->
                <div id="review-form">
                    <h3>Write a Review</h3>
                    <div class="form-group">
                        <label>Rating</label>
                        <div class="star-rating" id="star-rating">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Your Review</label>
                        <textarea id="review-comment" placeholder="Share your experience..."></textarea>
                    </div>
                    <div class="form-buttons">
                        <button id="cancel-review">Cancel</button>
                        <button id="submit-review">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

            },

                lng: -123.25270,
                seats: 180,

                rating: 4.7,

                hours: "7am - 12am",

                    { user: "James", rating: 4, comment: "Even non-law students love studying here!" }
                ]
            },
            {
                id: 14,
                name: "CIRS Building",
                lat: 49.26100,
                lng: -123.24950,
                seats: 70,
                noise: "Quiet",
                outlets: true,
                rating: 4.5,
                location: "2260 West Mall",
                hours: "7am - 10pm",
                reviews: [
                    { user: "Grace", rating: 5, comment: "Sustainable building with great natural lighting!" },
                    { user: "Tyler", rating: 4, comment: "Modern and eco-friendly. Nice atmosphere." }
                ]
            },
            {
                id: 15,
                name: "Ponderosa Commons Oak House",
                lat: 49.26180,
                lng: -123.25130,
                seats: 120,
                noise: "Moderate",
                outlets: true,
                rating: 4.3,
                location: "2075 West Mall",
                hours: "24/7",
                reviews: [
                    { user: "Hannah", rating: 4, comment: "Great for residence students. Open all night!" },
                    { user: "Liam", rating: 4, comment: "Convenient and comfortable. Can get chatty sometimes." }
                ]
            }
        ];

        let map;
        let selectedMarker = null;
        let selectedSpot = null;
        let markers = [];
        let currentRating = 5;

        const UBC_CENTER = { lat: 49.2606, lng: -123.2460 };

        // Initialize map
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: UBC_CENTER,
                zoom: 15,
                styles: [
                    {
                        featureType: "poi",
                        elementType: "labels",
                        stylers: [{ visibility: "off" }]
                    }
                ]
            });

            // Create markers
            studySpots.forEach(spot => {
                createMarker(spot);
            });

            setupEventListeners();
        }

        function createMarker(spot) {
            const marker = new google.maps.Marker({
                map: map,
                position: { lat: spot.lat, lng: spot.lng },
                title: spot.name,
                icon: {
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: "#9b7dd4",
                    fillOpacity: 1,
                    strokeColor: "#ffffff",
                    strokeWeight: 2
                }
            });

            markers.push({ marker, spot });

            marker.addListener('click', () => {
                selectSpot(marker, spot);
            });
        }

        function selectSpot(marker, spot) {
            // Reset previous selection
            if (selectedMarker) {
                selectedMarker.setIcon({
                    path: google.maps.SymbolPath.CIRCLE,
                    scale: 10,
                    fillColor: "#9b7dd4",
                    fillOpacity: 1,
                    strokeColor: "#ffffff",
                    strokeWeight: 2
                });
            }

            // Highlight selected marker
            marker.setIcon({
                path: google.maps.SymbolPath.CIRCLE,
                scale: 12,
                fillColor: "#7c5fc2",
                fillOpacity: 1,
                strokeColor: "#ffffff",
                strokeWeight: 3
            });

            selectedMarker = marker;
            selectedSpot = spot;

            displaySpotDetails(spot);
        }

        function displaySpotDetails(spot) {
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('details').style.display = 'block';
            document.getElementById('review-form').style.display = 'none';
            document.getElementById('add-review-btn').style.display = 'block';

            document.getElementById('spot-name').textContent = spot.name;
            document.getElementById('spot-rating').innerHTML = '⭐'.repeat(Math.round(spot.rating)) + ' ' + spot.rating;
            document.getElementById('spot-seats').textContent = spot.seats;
            document.getElementById('spot-noise').textContent = spot.noise;
            document.getElementById('spot-outlets').textContent = spot.outlets ? 'Yes' : 'No';
            document.getElementById('spot-outlet-icon').textContent = spot.outlets ? '🔌' : '❌';
            document.getElementById('spot-location').textContent = spot.location;
            document.getElementById('spot-hours').textContent = spot.hours;

            document.getElementById('review-count').textContent = spot.reviews.length;
            const reviewsList = document.getElementById('reviews-list');
            reviewsList.innerHTML = '';

            if (spot.reviews.length === 0) {
                reviewsList.innerHTML = '<p style="color: #999;">No reviews yet. Be the first to review!</p>';
            } else {
                spot.reviews.forEach(review => {
                    const reviewDiv = document.createElement('div');
                    reviewDiv.className = 'review';
                    reviewDiv.innerHTML = `
                        <div class="review-header">
                            <span class="review-user">${review.user}</span>
                            <span class="review-rating">${'⭐'.repeat(review.rating)}</span>
                        </div>
                        <p class="review-comment">${review.comment}</p>
                    `;
                    reviewsList.appendChild(reviewDiv);
                });
            }
        }

        function setupEventListeners() {
            document.getElementById('add-review-btn').onclick = () => {
                document.getElementById('add-review-btn').style.display = 'none';
                document.getElementById('review-form').style.display = 'block';
            };

            document.getElementById('cancel-review').onclick = () => {
                document.getElementById('review-form').style.display = 'none';
                document.getElementById('add-review-btn').style.display = 'block';
            };

            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                star.onclick = () => {
                    currentRating = parseInt(star.dataset.rating);
                    updateStars();
                };
            });

            document.getElementById('submit-review').onclick = submitReview;
        }

        function updateStars() {
            const stars = document.querySelectorAll('.star');
            stars.forEach(star => {
                if (parseInt(star.dataset.rating) <= currentRating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitReview() {
            const comment = document.getElementById('review-comment').value;
            if (!comment) {
                alert('Please write a review!');
                return;
            }

            selectedSpot.reviews.push({
                user: 'You',
                rating: currentRating,
                comment: comment
            });

            displaySpotDetails(selectedSpot);
            document.getElementById('review-comment').value = '';
            currentRating = 5;
            updateStars();
        }

        // Initialize stars
        updateStars();

        // Load Google Maps
        const API_KEY = 'AIzaSyBHplBjzNh6sM6Umtx4bgYJinjHHIaUR28';
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&callback=initMap`;
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);
    </script>
